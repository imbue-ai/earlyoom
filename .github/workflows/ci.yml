name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 23 * * 5' # Every Friday at 23:00

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # Looks like Github Actions leaks fds to child processes
    # https://github.com/actions/runner/issues/1188
    - run: ls -l /proc/self/fd

# Build and test in Ubuntu VM provided by Github CI
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0 # Make "git describe" work
    - run: sudo apt-get install -qq pandoc cppcheck
    - run: make
    - run: make test
    - run: git clean -dxff

# And also build in a number of docker containers of older
# distributions
    - name: Build and test in Debian Trixie
      uses: addnab/docker-run-action@v3
      with:
        image: debian:trixie
        options: -v ${{ github.workspace }}:/work
        run: |
          set -ex
          apt-get -qq update > /dev/null < /dev/null
          apt-get -qq install make gcc golang git ca-certificates > /dev/null < /dev/null
          cd /work
          make
          make test
    - run: git clean -dxff

    - name: Build and test in Amazon Linux 2
      uses: addnab/docker-run-action@v3
      with:
        image: amazonlinux:2
        options: -v ${{ github.workspace }}:/work
        run: |
          set -ex
          yum -y -q install make gcc golang git
          cd /work
          git config --global --add safe.directory /work # Fix for: fatal: detected dubious ownership in repository at '/work'
          make
          make test
    - run: git clean -dxff

    - name: Build in Oracle Linux 7 (similar to RHEL 7, CentOS 7)
      uses: addnab/docker-run-action@v3
      with:
        image: oraclelinux:7
        options: -v ${{ github.workspace }}:/work
        run: |
          set -ex
          yum -y -q install make gcc git
          cd /work
          make
    - run: git clean -dxff

    - name: Build in Oracle Linux 8 (similar to RHEL 8, CentOS 8)
      uses: addnab/docker-run-action@v3
      with:
        image: oraclelinux:8
        options: -v ${{ github.workspace }}:/work
        run: |
          set -ex
          dnf -y -q install make gcc git
          cd /work
          make
    - run: git clean -dxff

  # The real binary, gVisor's real /proc and a real memory limit: the kill
  # order must follow the kernel badness, where the band's oom_score_adj beats
  # a larger RSS. gVisor serves every oom_score as 0, so this is the case
  # upstream earlyoom gets wrong; the control step checks that it still does,
  # which proves the test can fail.
  runsc-ordering:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      # Keep at PINNED_GVISOR_RELEASE in the monorepo's
      # libs/mngr_vps/imbue/mngr_vps/host_setup.py (the production pin).
      GVISOR_RELEASE: "20260601"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # "git describe", and the v1.9.0 tag for the control
    - name: Install runsc
      run: |
        set -euxo pipefail
        url="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64"
        cd "$(mktemp -d)"
        for f in runsc containerd-shim-runsc-v1; do
          curl -fsSL --retry 3 --retry-all-errors -o "$f" "${url}/${f}"
          curl -fsSL --retry 3 --retry-all-errors -o "${f}.sha512" "${url}/${f}.sha512"
          sha512sum -c "${f}.sha512"
        done
        chmod a+rx runsc containerd-shim-runsc-v1
        sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin/
        sudo /usr/local/bin/runsc install
        sudo systemctl restart docker
        docker run --rm --runtime=runsc busybox dmesg | grep 'Starting gVisor'
    - name: Build the fork, upstream v1.9.0 and v1.9.0-imbue.2 (static)
      run: |
        set -euxo pipefail
        CFLAGS=-static make earlyoom
        mv earlyoom earlyoom-fork
        git worktree add /tmp/upstream v1.9.0
        (cd /tmp/upstream && CFLAGS=-static make earlyoom)
        cp /tmp/upstream/earlyoom earlyoom-upstream
        git worktree add /tmp/imbue2 v1.9.0-imbue.2
        (cd /tmp/imbue2 && CFLAGS=-static make earlyoom)
        cp /tmp/imbue2/earlyoom earlyoom-imbue2
    - name: Kill order follows the badness under runsc
      run: >-
        docker run --rm --runtime=runsc --memory=512m --memory-swap=512m --cap-add SYS_RESOURCE
        -v "$PWD:/work:ro" python:3.12-slim
        python3 /work/ci/runsc_ordering_test.py --earlyoom /work/earlyoom-fork --expect badness
    - name: "Control: upstream v1.9.0 kills out of badness order under runsc"
      run: >-
        docker run --rm --runtime=runsc --memory=512m --memory-swap=512m --cap-add SYS_RESOURCE
        -v "$PWD:/work:ro" python:3.12-slim
        python3 /work/ci/runsc_ordering_test.py --earlyoom /work/earlyoom-upstream --expect not-badness
    - name: "Control: v1.9.0-imbue.2 signals a zombie under runsc"
      run: >-
        docker run --rm --runtime=runsc --memory=512m --memory-swap=512m --cap-add SYS_RESOURCE
        -v "$PWD:/work:ro" python:3.12-slim
        python3 /work/ci/runsc_ordering_test.py --earlyoom /work/earlyoom-imbue2 --expect zombie-signalled
